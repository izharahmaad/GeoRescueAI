data:
  root: data/raw/BRIGHT
  crop_size: 640
  optical_channels: 3
  sar_channels: 3
  num_classes: 4

model:
  name: fusion_unet
  base_channels: 32
  dropout: 0.1

training:
  device: auto
  batch_size: 1
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  amp: true
  seed: 42
  checkpoint_dir: outputs/checkpoints
  best_checkpoint_name: bright_best_model.pt